name: Build & deploy

# Type-checks and builds the site on every pull request, and publishes main to Cloudflare Pages:
#   - on every push to main
#   - by hand, from the Actions tab (Run workflow)
# The daily rebuild that keeps the GitHub star counts fresh is not scheduled here. The Orion-Website
# repo's deploy workflow does it, so one scheduled action updates both sites (docs/orion-website-deploy.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Your site's name on Cloudflare. It becomes https://<name>.pages.dev
  # Keep it the same as PORTFOLIO_PAGES_PROJECT in the Orion-Website workflow.
  PAGES_PROJECT: rookiez

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Refresh the GitHub star counts
        # only rewrites the numbers inside this build; nothing is committed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run stats

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set, so nothing was published. See README → Deploy."
            exit 0
          fi
          # Creates the project on the first run; afterwards it already exists and this is skipped.
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
